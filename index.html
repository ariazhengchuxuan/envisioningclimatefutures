    <style>
        :root {
            --blue: #163f59;
            --blue-mid: #215a7f;
            --blue-light: #4889b0;
            --blue-pale: #eaf1f5;
            --green: #1d5b43;
            --green-light: #358c6b;
            --green-pale: #e2f0ea;
            --white: #ffffff;
            --bg: #f9fbfd;
            --ink: #111e26;
            --ink-mid: #3d505c;
            --ink-light: #7c93a3;
            --rule: rgba(22, 63, 89, 0.08);
            --border: rgba(22, 63, 89, 0.08);
            --shadow-sm: 0 2px 8px rgba(22, 63, 89, 0.04);
            --shadow-md: 0 8px 30px rgba(22, 63, 89, 0.08);
            --shadow-lg: 0 20px 50px rgba(22, 63, 89, 0.12);
            --radius-md: 0px;
            --radius-lg: 0px;
            --primary: var(--blue);
            --primary-mid: var(--blue-mid);
            --secondary: var(--blue-light);
            --accent: #b54a16;
            --accent-light: #d6642d;
            --hope-green: var(--green);
            --teal: #1f6464;
            --water: #78bdd6;
            --warm: #b87b2e;
            --sky: #5d9fba;
            --bg-light: var(--bg);
            --bg-white: var(--white);
            --text: var(--ink);
            --text-medium: var(--ink-mid);
            --text-light: var(--ink-light);
            --transition-smooth: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .text-link {
            color: var(--primary);
            text-decoration: underline;
            text-decoration-color: rgba(22, 63, 89, 0.3);
            text-underline-offset: 3px;
            font-weight: 500;
            transition: var(--transition-smooth);
        }

        .text-link:hover {
            color: var(--accent);
            text-decoration-color: var(--accent);
        }

        .text-link.ext {
            display: inline-flex;
            align-items: center;
            gap: 2px;
        }

        .text-link.ext::after {
            content: "↗";
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 0.85em;
            font-weight: 700;
            opacity: 0.55;
            margin-left: 1px;
            transform: translateY(-1px);
        }

        /* Image Carousel */
        .img-carousel {
            position: relative;
            width: 100%;
            margin: 2rem 0;
            box-shadow: var(--shadow-md);
            background: #0a111a;
            user-select: none;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .carousel-img-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
        }

        .carousel-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            animation: fadeIn 0.5s ease-in-out;
        }

        .carousel-gradient {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60%;
            background: linear-gradient(to top, rgba(10, 17, 26, 0.9) 0%, rgba(10, 17, 26, 0) 100%);
            pointer-events: none;
            z-index: 1;
        }

        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            font-size: 1.2rem;
            color: white;
            transition: all 0.2s;
        }

        .carousel-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .carousel-btn.left {
            left: 1.2rem;
        }

        .carousel-btn.right {
            right: 1.2rem;
        }

        .carousel-text-container {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 1.5rem 2rem;
            z-index: 5;
        }

        .carousel-caption {
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.4rem;
            font-family: 'DM Sans', sans-serif;
        }

        .carousel-desc {
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.9rem;
            line-height: 1.5;
            max-width: 80%;
        }

        .carousel-counter {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 2px;
        }

        @media (max-width: 768px) {
            .carousel-btn {
                width: 36px;
                height: 36px;
                font-size: 1rem;
            }

            .carousel-btn.left {
                left: 0.5rem;
            }

            .carousel-btn.right {
                right: 0.5rem;
            }

            .carousel-text-container {
                position: static;
                padding: 1.2rem 1rem;
            }

            .carousel-gradient {
                display: none;
            }

            .carousel-desc {
                max-width: 100%;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            overflow-x: hidden;
            width: 100%;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--ink);
            line-height: 1.65;
            -webkit-font-smoothing: antialiased;
        }

        h1,

            font-family: 'DM Sans', sans-serif;
            font-weight: 600;
            line-height: 1.15;
            letter-spacing: -0.01em;
        }

        img,
        video,
        figure {
            border-radius: 0 !important;
        }

        figcaption {
            text-align: center;
        }

        }

            transform: rotate(180deg);
            opacity: 1;
        }

        .nav-dropdown {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%) translateY(-4px);
            background: #ffffff;
            min-width: 240px;
            width: max-content;
            max-width: 320px;
            box-shadow: 0 16px 45px -10px rgba(15, 42, 63, 0.22), 0 0 0 1px rgba(0, 0, 0, 0.06);
            border-top: 3px solid var(--accent);
            border-radius: 0 0 12px 12px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s cubic-bezier(0.16, 1, 0.3, 1), transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.2s;

            display: flex;

            gap: 2px;
        }

        .nav-dropdown-item {
            display: block;
            padding: 0.65rem 1rem;
            color: var(--primary);
            font-size: 0.9rem;
            font-weight: 500;
            line-height: 1.4;
            text-decoration: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
            white-space: nowrap;
            letter-spacing: 0.01em;
            font-family: 'DM Sans', sans-serif;
            text-align: left;
        }

        .nav-dropdown-item:hover {
            background: rgba(22, 63, 89, 0.06);
            color: var(--accent);
            padding-left: 1.2rem;
        }

        .nav-dropdown.projects-menu {
            min-width: 960px;
            max-width: 1020px;
            padding: 1.4rem 1.6rem;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.85rem 1.15rem;
            border-radius: 0 0 16px 16px;
            box-shadow: 0 24px 60px -12px rgba(15, 42, 63, 0.28), 0 0 0 1px rgba(0, 0, 0, 0.08);
            border-top: 3px solid var(--accent);
            left: 50%;
            transform: translateX(-50%) translateY(-4px);
        }

        .nav-item:hover .nav-dropdown {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        .nav-project-card {
            display: flex;
            align-items: flex-start;
            gap: 0.8rem;
            padding: 0.85rem 0.95rem;
            border-radius: 10px;

            text-align: left;

        }

        .nav-project-card:hover {
            background: #ffffff;
            border-color: rgba(44, 95, 122, 0.35);

        .nav-project-card .nav-proj-badge {
            background: rgba(181, 74, 22, 0.1);

            border: 1px solid rgba(181, 74, 22, 0.2);

        .nav-project-card:hover .nav-proj-badge {
            background: var(--accent);
            color: #ffffff;
            border-color: var(--accent);
        }

        .nav-project-content {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;

        .nav-project-title {

        .nav-project-card:hover .nav-project-title {
            color: var(--accent);
        }

        .nav-project-loc {
            font-size: 0.76rem;
            color: var(--text-medium);
            line-height: 1.35;

        }

        /* FOOTER */
        .footer {
            background: linear-gradient(135deg, #0f2a3f 0%, #1a4a6b 60%, #0d3d5a 100%);
            padding: 3.5rem 2rem;
            margin-top: 5rem;
            position: relative;
            overflow: hidden;
        }

        .footer::before {
            content: '';
            position: absolute;
            top: -60px;
            right: -60px;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(93, 183, 212, 0.12) 0%, transparent 70%);
        }

        .footer::after {
            content: '';
            position: absolute;
            bottom: -40px;
            left: 10%;
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(232, 98, 42, 0.1) 0%, transparent 70%);
        }

        .footer-content {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .footer-nav {
            display: flex;
            justify-content: center;

            margin-bottom: 2rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            flex-wrap: wrap;
        }

        .footer-nav-link {
            color: rgba(255, 255, 255, 0.75);
            font-size: 0.95rem;
            transition: color 0.2s;

        }

        .footer-nav-link:hover {
            color: var(--water);
        }

        .footer-copyright {
            text-align: center;

        }

        .footer-logos {

        }

        .landing {

            margin: 0;
            padding: 0 0 4rem 0;
            padding-top: 72px;
            box-sizing: border-box;

        }

<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        /* ─── ANALYTICS HELPER ─── */
        const trackEvent = (name, props = {}) => {
            if (window.op) {
                try {
                    window.op('track', name, props);
                    console.log(`[OpenPanel] Logged event: ${name}`, props);
                } catch(e) { console.error("[OpenPanel] Tracking error:", e); }
            } else {
                console.warn(`[OpenPanel] SDK not found. Queuing event: ${name}`);
            }
        };
        /* ─── SCROLL DEPTH TRACKER ─── */
        (function() {
            const thresholds = [25, 50, 75, 100];
            const fired = {};
            const getPage = () => (window.location.hash.replace('#', '') || 'home');
            window.addEventListener('hashchange', () => { Object.keys(fired).forEach(k => delete fired[k]); });
            window.addEventListener('scroll', function() {
                const doc = document.documentElement;
                const scrollTop = window.pageYOffset || doc.scrollTop;
                const scrollHeight = doc.scrollHeight - doc.clientHeight;
                if (scrollHeight <= 0) return;
                const pct = Math.round((scrollTop / scrollHeight) * 100);
                const pg = getPage();
                thresholds.forEach(t => {
                    const key = pg + '_' + t;
                    if (pct >= t && !fired[key]) {
                        fired[key] = true;
                        trackEvent('scroll_depth', { page: pg, depth: t + '%' });
                    }
                });
            }, { passive: true });
        })();

        /* ─── TIME ON PAGE TRACKER ─── */
        (function() {
            let pageStart = Date.now();
            let currentPage = window.location.hash.replace('#', '') || 'home';
            window.addEventListener('hashchange', () => {
                const elapsed = Math.round((Date.now() - pageStart) / 1000);
                if (elapsed > 1) trackEvent('time_on_page', { page: currentPage, seconds: elapsed });
                currentPage = window.location.hash.replace('#', '') || 'home';
                pageStart = Date.now();
            });
            window.addEventListener('beforeunload', () => {
                const elapsed = Math.round((Date.now() - pageStart) / 1000);
                if (elapsed > 1) trackEvent('time_on_page', { page: currentPage, seconds: elapsed });
            });
        })();

        /* ─── SESSION METADATA ─── */
        (function() {
            const w = window.innerWidth;
            const device = w <= 500 ? 'mobile' : w <= 860 ? 'tablet' : 'desktop';
            trackEvent('session_start', {
                device_type: device,
                viewport: w + 'x' + window.innerHeight,
                referrer: document.referrer || 'direct',
                language: navigator.language || 'unknown'
            });
        })();


        /* ─── SHARED PRIMITIVES ─── */

        function useInView(options = { threshold: 0.15 }) {
            const [isInView, setIsInView] = React.useState(false);
            const ref = React.useRef(null);
            React.useEffect(() => {
                const observer = new IntersectionObserver(([entry]) => {
                    if (entry.isIntersecting) {
                        setIsInView(true);
                        observer.disconnect();
                    }
                }, options);
                if (ref.current) observer.observe(ref.current);
                return () => { if (observer) observer.disconnect(); };
            }, []);
            return [ref, isInView];
        }

        function FadeInUp({ children, delay = 0, style = {} }) {
            const [ref, isInView] = useInView();
            return (
                <div ref={ref} style={{ opacity: isInView ? 1 : 0, transform: isInView ? 'translateY(0)' : 'translateY(30px)', transition: `opacity 0.7s cubic-bezier(0.25, 0.8, 0.25, 1) ${delay}s, transform 0.7s cubic-bezier(0.25, 0.8, 0.25, 1) ${delay}s`, ...style }}>
                    {children}
                </div>
            );
        }


        function Block({ label, children, full, id }) {
            if (full) return (
                <div className="c-block full" id={id}><div className="c-content">{children}</div></div>
            );
            return (
                <div className="c-block" id={id}>
                    <div className="c-label"><h2>{label}</h2></div>
                    <div className="c-content">{children}</div>
                </div>
            );
        }

        /* Observe when an element enters viewport → fires section_viewed once */
        function SectionTracker({ name }) {
            const ref = React.useRef(null);
            React.useEffect(() => {
                if (!ref.current) return;
                const obs = new IntersectionObserver(([e]) => {
                    if (e.isIntersecting) { trackEvent('section_viewed', { section: name }); obs.disconnect(); }
                }, { threshold: 0.2 });
                obs.observe(ref.current);
                return () => obs.disconnect();
            }, [name]);
            return <div ref={ref} style={{ height: '1px', marginBottom: '-1px', pointerEvents: 'none' }} />;
        }
        function ExpandableImage({ src, alt, containerStyle, ...props }) {
            const [expanded, setExpanded] = useState(false);
            const [zoomed, setZoomed] = useState(false);

            const close = (e) => { e.stopPropagation(); setExpanded(false); setZoomed(false); trackEvent('image_close', { image: alt }); };
            const toggleZoom = (e) => { e.stopPropagation(); setZoomed(!zoomed); };

            return (
                <div style={{ position: 'relative', width: '100%', ...containerStyle }}>
                    <img src={src} alt={alt} {...props} style={{ ...props.style, cursor: 'pointer' }} onClick={() => { setExpanded(true); trackEvent('image_expand_clicked', { image: alt }); }} />
                    <button onClick={() => setExpanded(true)} style={{ position: 'absolute', top: '10px', right: '10px', background: 'rgba(255,255,255,0.9)', border: '1px solid var(--border)', borderRadius: '4px', padding: '6px 12px', cursor: 'pointer', fontSize: '0.8rem', fontWeight: 'bold', boxShadow: '0 2px 6px rgba(0,0,0,0.15)', color: 'var(--ink)', zIndex: 2, display: 'flex', alignItems: 'center', gap: '4px' }} data-track="image_expand">
                        <span>⛶</span> Expand
                    </button>
                    {expanded && ReactDOM.createPortal(

                                <p>To build computer simulation models of extreme weather events and then translate them into accessible images and experiences. To help individuals and communities</p>

                                    <li style={{ marginBottom: '0.3rem', color: 'var(--ink-mid)', lineHeight: '1.8', fontSize: '0.965rem' }}><span style={{ color: 'var(--ink-light)', marginRight: '0.5rem' }}>a)</span>better understand past extreme weather events;</li>

                                    <li style={{ marginBottom: '0.3rem', color: 'var(--ink-mid)', lineHeight: '1.8', fontSize: '0.965rem' }}><span style={{ color: 'var(--ink-light)', marginRight: '0.5rem' }}>c)</span>see how constructive actions could reduce the damage from future storms.</li>
                                </ul>
                                <p>To produce constructive change in the behaviour of individuals and more thoughtful and open policy deliberations by government.</p>
                            </Block>
                            <Block label="Approach">
                                <p><strong>Well-designed images help people engage thoughtfully with critical issues.</strong> We therefore visualize extreme weather events — situations where climate change affects people most directly.</p>
                                <p>Depictions of floods and fires show what neighborhoods have experienced, how damage could become worse, and how risks would be reduced if we act soon.</p>
                                <div style={{ background: 'rgba(181,74,22,0.05)', borderLeft: '4px solid var(--accent)', padding: '1rem 1.25rem', margin: '1.5rem 0', borderRadius: '0 8px 8px 0' }}>
                                    <p style={{ margin: 0, fontWeight: '500', color: 'var(--primary)' }}><strong>What is novel is how we create experiences that portray the difference between action and inaction</strong> and use these to motivate and enable constructive change.</p>

        /* ─── FLOOD MODELLING ─── */
        function FloodModellingPage() {
            return (
                <>
                    <div className="content-page">
                        <div className="content-page-header"><h1>Flood Modelling</h1></div>
                        <SectionTracker name="flood_modelling_intro" />
                        <div className="c-group">
                            <Block full>
                                <p>Our work proceeds as a series of case studies. The locations we study have experienced one or several instances of severe flooding and have gathered reliable data with which to calibrate and validate our models.</p>
                                <div style={{ background: 'var(--white)', border: '1px solid var(--border)', padding: '1.25rem 1.5rem', borderRadius: '12px', margin: '1.5rem 0', boxShadow: '0 4px 18px rgba(44,95,122,0.04)' }}>
                                    <p style={{ margin: 0, color: 'var(--ink-mid)' }}>The situations can be used to illustrate the difference in plausible future flooding based on the degree to which there is <strong><span style={{ color: 'var(--accent)' }}>inaction</span> (making future floods worse)</strong> or <strong><span style={{ color: 'var(--primary)' }}>constructive actions</span> (making the damage from future floods less severe)</strong>.</p>
                                </div>
                                <p>This website reports on our first case studies, <a className="text-link" href="#don-river-problem">flooding at the mouth of the Don River (Toronto)</a>, and <a className="text-link" href="#etobicoke-problem">flooding of the Little Etobicoke Creek (Mississauga)</a>.</p>
                            </Block>
                            <Block label="Modelling Systems">
                                <p>Past flooding is reproduced mathematically by modelling the flood in one of a set of computer systems for doing this. Thus far, we have used in our work both <a className="text-link ext" href="https://www.esri.com/content/dam/esrisites/en-us/media/technical-papers/flood-simulation-arcgis-pro.pdf" target="_blank" rel="noopener noreferrer" onClick={() => trackEvent('external_link_clicked', { url: 'esri_arcgis' })}>ESRI ArcGIS</a> and the <a className="text-link ext" href="https://www.civilgeo.com/the-road-to-hec-ras/" target="_blank" rel="noopener noreferrer" onClick={() => trackEvent('external_link_clicked', { url: 'hec_ras' })}>U.S. Army's HEC-RAS</a>.</p>
                            </Block>
                            <Block label="Model Inputs">
                                <p>Data used as input to a flood model includes:</p>
                                <div style={{ background: '#f5f8fa', borderRadius: '10px', padding: '1rem 1.5rem', marginBottom: '1.5rem' }}>
                                    <ul style={{ margin: 0 }}>
                                        <li>Topography;</li>
                                        <li>Land surface characteristics such as rivers and streams, dams and culverts;</li>
                                        <li>Underground streams and drainage systems; and</li>
                                        <li>Absorptive properties of structures on the ground such as building rooftops and parking lots.</li>
                                    </ul>
                                </div>
                                <p>Models are driven by data on the water that comes from sources such as rainfall, tides, rising sea levels, and ocean surges. Models output descriptions of water flowing with varying velocities over landscapes over periods of time.</p>
                                <p><strong>If strong enough, these water flows are floods.</strong></p>
                            </Block>
                            <Block label="Future Projections">
                                <p>Once we can reproduce past flooding, we can use the model to imagine, project, and visualize future climate scenarios.</p>
                                <p>Climate change continues to pump more greenhouse gases into the atmosphere and increase the earth's surface temperature. Rainfall becomes worse because there is more moisture in the atmosphere. Storms become worse and more unpredictable because of greater numbers of events such as rainstorms, hurricanes, typhoons, and tsunamis.</p>
                                <p>On the other hand, concrete actions can be undertaken. Some actions affect the speed of climate change. These include decreasing our reliance on fossil fuels, increasing the use of electric vehicles, slowing the destruction of forests, substituting electronic communications for travel, and eating less meat. Other actions are specific to flood prevention. These include reengineering rivers and how they flow; increasing the capacity of drainage systems; constructing barriers to the flow of water such as dams and levees; and modifying the absorptive qualities of upstream land features.</p>
                                <p>We believe (and will gather evidence as one of our research activities) that such modelling and visualizing exercises will give people a greater sense of agency with respect to climate change and the vagaries of extreme weather, and will be a tool to enable more open, thoughtful, and constructive policy deliberations.</p>
                            </Block>

        /* ─── GRAND ETHIOPIAN RENAISSANCE DAM (TORONTO) ─── */
        function GerdDam() {
            return (
                <>
                    <div className="content-page">
                        <div className="content-page-header" style={{ backgroundImage: "url('assets/gerd-dam.jpg')" }}>
                            <span className="page-project-badge">Project 3</span>
                            <h1>Grand Ethiopian Renaissance Dam</h1>
                            <div className="page-location"><span>University of Toronto (Toronto)</span></div>
                        </div>
                        <SubNav items={gerdItems} />
                        <div className="c-group">
                            <Block label="The Problem" id="gerd-problem">
                                <p>
                                    The Nile is the longest river in Africa, sustaining roughly 500 million people across 11 countries and covering about 10% of the continent's land area. For Egypt and Sudan especially, the Nile is the primary water source, and both countries already face real water stress as populations grow and rainfall becomes less predictable. The Grand Ethiopian Renaissance Dam (GERD), Africa's largest hydropower plant, sits near the Ethiopia-Sudan border and has become the most contested water project on the continent.
                                </p>
                                <div style={{ margin: '1.75rem 0' }}>
                                    <ImgCard 
                                        src="assets/gerd-dam.jpg" 
                                        alt="The Grand Renaissance Ethiopian Dam (GERD)" 
                                        caption="The Grand Renaissance Ethiopian Dam (GERD)" 
                                    />
                                </div>
                            </Block>
                            <Block label="Key Facts">
                                <ul>
                                    <li>Egypt depends on the Nile River for roughly 90% of its water</li>
                                    <li>The GERD has an installed capacity of 5.15 GW, making it Africa's largest hydropower plant, with a reservoir capacity of 74 billion m³, about 1.5 times the Nile's average annual flow at the dam site</li>
                                    <li>Construction began in 2011; the reservoir was filled in five stages between 2020 and 2024, and the dam was officially inaugurated on September 9, 2025</li>
                                    <li>Without coordination, GERD outflows could raise Sudan's flood risk in high-inflow years, while low releases during droughts could cost Egypt billions in GDP and irrigation water</li>
                                </ul>
                            </Block>
                            <Block>
                                <p>
                                    For Sudan, cooperative GERD operation could help reduce flooding along the Blue Nile and the Main Nile. Our studies find that active data-sharing between Ethiopia and Sudan could cut the share of years with a riverine flooding alarm at Khartoum from 37% to 11%. But high outflows in wet years remain possible, and there is a real risk that as people settle into a newly calmer flow regime, flood vulnerability quietly increases.
                                </p>
                                <p>
                                    For Egypt, the concern runs the other way. The GERD's total storage is roughly 1.5 times the average annual flow at the Egypt-Sudan border, and if Ethiopia manages the dam without regard for downstream needs, Egypt faces irrigation shortfalls and reduced hydropower output, particularly during multi-year droughts.
                                </p>
                                <p>
                                    Since construction began in 2011, negotiations between Ethiopia, Sudan, and Egypt have repeatedly stalled. Proposals like the 2020 "Washington draft" were rejected as unacceptable by one side or another, and disputes have at times escalated to talk of military options. The underlying tension is structural: Ethiopia wants reliable power generation, while Sudan and Egypt want predictable, minimally disruptive water flows—objectives that pull in different directions.
                                </p>
                            </Block>
                            <Block label="The Solution" id="gerd-solution">
                                <p>
                                    In our project, we looked at what happens when a single piece of infrastructure reshapes that shared resource. We examined the risks it poses to Sudan and Egypt, and modelled a cooperative, adaptive approach to managing it that could turn a decade of conflict into shared benefit. Rather than treating the GERD as a zero-sum problem, our work modelled a cooperative adaptive management policy where the dam's operating rules adjust over time based on real inflow data, and where each country's interests are explicitly built in.
                                </p>
                                <p>
                                    The policy we designed lets GERD releases respond to actual conditions: a regular power target during normal years, a reduced target to let the reservoir recover during droughts, and a guaranteed minimum release to protect Egypt when the High Aswan Dam runs low. Every five years, the policy re-calibrates itself based on trends of inflows to the GERD.
                                </p>
                                <p>
                                    Using river system and economic models for all three countries across 29 climate projections, we searched for management designs that balance national interests rather than maximize just one country's benefit. The results show that pursuing any single country's best-case outcome comes at a cost to the other two (see figure), but a compromise design produces positive average GDP outcomes for Ethiopia, Sudan, and Egypt alike, demonstrating that cooperation is the economically efficient choice.
                                </p>

                                        src="assets/gerd-policy-plot.jpg" 
                                        alt="Parallel coordinates plot of GERD management policy"

                                    />
                                </div>
                            </Block>

                                            onMouseOver={e => { e.currentTarget.style.borderLeftColor = 'var(--primary)'; e.currentTarget.style.background = 'var(--blue-pale)'; }}
                                            onMouseOut={e => { e.currentTarget.style.borderLeftColor = 'var(--accent)'; e.currentTarget.style.background = 'white'; }}>
                                            <span style={{ fontSize: '0.975rem', fontWeight: '500', color: 'var(--primary)', fontFamily: "'DM Sans', sans-serif" }}>{p.name}</span>
                                            <svg style={{ flexShrink: 0, opacity: 0.35 }} width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><line x1="7" y1="17" x2="17" y2="7" /><polyline points="7 7 17 7 17 17" /></svg>
                                        </a>
                                    ))}
                                </div>
                            </Block>
                        </div>
                    </div>
                    <Footer />
                </>
            );
        }

        /* ─── SPONSORS ─── */
        function SponsorsPage() {
            const institutional = [
                { name: 'Department of Computer Science, University of Toronto', url: 'https://web.cs.toronto.edu/' },
                { name: 'Holgan 8T8 Foundation', url: null },
                { name: 'School of Cities, University of Toronto', url: 'https://schoolofcities.utoronto.ca/' },
                { name: 'SideFX', url: 'https://www.sidefx.com/' },
            ];
            const individual = [
                { name: 'John Baker', url: 'https://www.d2l.com/blog/author/jbaker/' },
                { name: 'Kim Davidson', url: 'https://en.wikipedia.org/wiki/Kim_Davidson' },
                { name: 'Michael Brown', url: 'https://www.eecs.yorku.ca/~mbrown/' },
                { name: 'Ronald Baecker', url: 'https://ronbaecker.com/' },
                { name: 'William Buxton', url: 'http://billbuxton.com/' },
                { name: 'William T. Reeves and Ricki Blau', url: 'https://en.wikipedia.org/wiki/William_Reeves_(animator)' },
            ];
            const Row = ({ name, url }) => (
                <div
                    style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '1rem 1.25rem', background: 'white', border: '1px solid var(--border)', borderLeft: '3px solid var(--primary)', gap: '1rem', cursor: url ? 'pointer' : 'default', transition: 'all 0.2s' }}
                    onClick={() => url && window.open(url, '_blank')}
                    onMouseOver={e => { if (url) { e.currentTarget.style.borderLeftColor = 'var(--accent)'; e.currentTarget.style.background = 'var(--blue-pale)'; } }}
                    onMouseOut={e => { e.currentTarget.style.borderLeftColor = 'var(--primary)'; e.currentTarget.style.background = 'white'; }}>
                    <span style={{ fontSize: '0.975rem', fontWeight: '500', color: 'var(--primary)', fontFamily: "'DM Sans', sans-serif" }}>{name}</span>
                    {url && <svg style={{ flexShrink: 0, opacity: 0.35 }} width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><line x1="7" y1="17" x2="17" y2="7" /><polyline points="7 7 17 7 17 17" /></svg>}
                </div>
            );
            return (
                <>
                    <div className="content-page">
                        <div className="content-page-header"><h1>Sponsors</h1></div>
                        <SectionTracker name="sponsors" />
                        <div className="c-group">
                            <Block label="Institutional">
                                <div style={{ display: 'flex', flexDirection: 'column', gap: '0.5rem' }}>
                                    {institutional.map((s, i) => <Row key={i} name={s.name} url={s.url || null} />)}
                                </div>
                            </Block>
                            <Block label="Individual">
                                <div style={{ display: 'flex', flexDirection: 'column', gap: '0.5rem' }}>
                                    {individual.map((s, i) => <Row key={i} name={s.name} url={s.url || null} />)}
                                </div>
                            </Block>
                        </div>
                    </div>
                    <Footer />
                </>
            );
        }

        function ContactPage() {
            return (
                <>
                    <div className="content-page">
                        <div className="content-page-header"><h1>Contact</h1></div>
                        <SectionTracker name="contact" />
                        <div className="c-group">
                            <Block full>
                                <p>If you would like to learn more about our work, please feel free to reach out. We welcome inquiries from researchers, educators, policymakers, and members of the public who are interested in climate change visualization and extreme weather modelling.</p>
                                <p>You can contact us by email at: <a className="text-link" href="mailto:ronald.baecker@utoronto.ca" onClick={() => trackEvent('contact_email_clicked', { email: 'ronald.baecker@utoronto.ca' })}>ronald.baecker@utoronto.ca</a></p>
                            </Block>
                        </div>
                    </div>
                    <Footer />
                </>
            );
        }

        /* ─── EVENTS ─── */
        function EventsPage() {
            return (
                <>
                    <div className="content-page">
                        <div className="content-page-header"><h1>Events</h1></div>
                        <SectionTracker name="events" />
                        <div className="c-group">
                            <Block label="Sustainability Week">
                                <p>Our team participated in <strong>Sustainability Week</strong>, showcasing our climate visualization work and engaging with students, faculty, and community members about the impacts of extreme weather and the importance of climate action.</p>
                                <div style={{ margin: '1.5rem 0' }}>
                                    <figure style={{ margin: 0, overflow: 'hidden', boxShadow: '0 4px 18px rgba(44,95,122,0.13)', background: 'white' }}>
                                        <ExpandableImage
                                            src="https://res.cloudinary.com/dd4p37hyq/image/upload/v1775444503/sustainability_week_qes9zj.jpg"
                                            alt="Sustainability Week event"
                                            style={{ width: '100%', display: 'block', objectFit: 'cover' }}
                                        />
                                        <figcaption style={{ padding: '0.65rem 1rem', fontSize: '0.82rem', color: 'var(--text-medium)', fontStyle: 'italic', borderTop: '1px solid rgba(44,95,122,0.08)', background: 'white', textAlign: 'center' }}>
                                            Envisioning Climate Futures at Sustainability Week
                                        </figcaption>
                                    </figure>
                                </div>
                                <p>Events like these are an important part of our mission — bringing scientific insights about climate change and extreme weather directly to the public through accessible, engaging experiences.</p>
                            </Block>
                        </div>
                    </div>
                    <Footer />
                </>
            );
        }

        function ComingSoonPage({ project, title, location, prev }) {
            return (
                <>
                    <div className="content-page">
                        <div className="content-page-header">
                            {project && <span className="page-project-badge">{project}</span>}
                            <h1>{title}</h1>
                            {location && <div className="page-location"><span>{location}</span></div>}
                        </div>
                        <div className="c-group">
                            <Block full>
                                <p style={{ fontSize: '1.1rem', color: 'var(--text-medium)', textAlign: 'center', padding: '2rem 0' }}>This section is currently under development.</p>
                                <p style={{ textAlign: 'center' }}>Please check back later for updates as we continue our research and publish new content.</p>
                            </Block>
                        </div>
                        {prev && <NavRow prev={prev} />}
                    </div>
                    <Footer />
                </>
            );
        }

        /* ─── APP ─── */
        function App() {
            const [page, setPage] = useState('home');
            React.useEffect(() => {
                const handle = () => { 
                    const h = window.location.hash.replace('#', '') || 'home'; 
                    setPage(h); 
                    if (!window._preventScrollTop) {
                        window.scrollTo({ top: 0, behavior: 'smooth' }); 
                    }
                    window._preventScrollTop = false;
                    if (window.op) { try { window.op('trackScreenView'); } catch(e) {} }
                    trackEvent('page_view_manual', { page: h });
                };
                window.addEventListener('hashchange', handle);
                handle();
                return () => window.removeEventListener('hashchange', handle);
            }, []);
            const goTo = p => { window.location.hash = p; };
            return (
                <div>
                    <Navigation />
                    {page === 'home' && <LandingPage />}
                    {page === 'climate-change' && <ClimateChangePage />}
                    {page === 'methodology' && <MethodologyPage />}
                    {page === 'methodology-detail' && <MethodologyDetailPage />}
                    {page === 'flood-modelling' && <FloodModellingPage />}
                    {page === 'wildfire-modelling' && <ComingSoonPage title="Modelling Wildfires" />}
                    {(page === 'don-river' || page === 'don-river-problem') && <DonRiverProblem />}
                    {page === 'don-river-solution' && <DonRiverSolution />}
                    {page === 'don-river-viz' && <DonRiverViz />}
                    {(page === 'etobicoke' || page === 'etobicoke-problem') && <EtobicokeProblem />}
                    {page === 'etobicoke-solution' && <EtobicokeSolution />}
                    {page === 'etobicoke-viz' && <EtobicokeViz />}
                    {(page === 'north-rustico' || page === 'north-rustico-problem') && <NorthRusticoProblem />}
                    {page === 'north-rustico-viz' && <NorthRusticoViz />}
                    {page === 'chris' && <ChrisUpei />}
                    {page === 'upei-simulator' && <UpeiSimulator />}
                    {page === 'gerd' && <GerdDam />}
                    {page === 'brock-water-futures' && <BrockWaterFutures />}
                    {page === 'watershed-game' && <WatershedGame />}
                    {page === 'fort-mcmurray' && <FortMcMurray />}
                    {page === 'team' && <TeamPage onNext={() => goTo('methodology')} onPrev={() => goTo('etobicoke-problem')} />}
                    {page === 'partners' && <PartnersPage />}
                    {page === 'sponsors' && <SponsorsPage />}
                    {page === 'contact' && <ContactPage />}
                    {page === 'events' && <EventsPage />}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>

</html>
